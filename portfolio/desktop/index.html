<!DOCTYPE html>

<!-- ВЕРХНЯЯ ПАНЕЛЬ (ПОТОЛОК) -->

  <div class="identity">

  </div>

  <div class="social-bar">

        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="M3 7l9 6 9-6"/>
      </svg>
    </a>
    <a href="https://instagram.com/polindrous" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
      <svg viewBox="0 0 24 24">
        <defs>
          <linearGradient id="igGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#f58529"/>
            <stop offset="35%" stop-color="#dd2a7b"/>

        <rect x="6.5" y="6.5" width="11" height="11" rx="3.2" fill="none" stroke="#fff" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="3.1" fill="none" stroke="#fff" stroke-width="1.6"/>
        <circle cx="17" cy="7" r="1.1" fill="#fff"/>
      </svg>
    </a>
    <a href="https://t.me/polindrous" target="_blank" rel="noopener noreferrer" aria-label="Telegram" title="Telegram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2L11 13" />
        <path d="M22 2l-7 20-4-9-9-4 20-7z" />
      </svg>
    </a>
  </div>
</header>

        <div class="frame"><div class="mat">

        </div></div>
